# Pull fresh figures from the FEC, rebuild the workbook, run the gate, export
# the site payload, and commit and publish only if something actually changed.
#
# Cadence. The FEC key allows 60 calls a minute and 1,000 an hour; a run makes
# about 24 (roughly 70 once a week, when the final 2018-2024 figures and the
# spending and donor detail are re-pulled; the detail also refreshes whenever a
# new quarterly report lands). GitHub's
# cron floor is five minutes, which is where this is set: 12 runs an hour, a
# quarter of the hourly quota. The FEC itself processes filings in batches, so
# most runs find nothing new and, by design, leave no trace: changed.py
# discards timestamp-only diffs so the history is not 288 empty commits a day.
#
# The secret. Without FEC_API_KEY the job does nothing and exits green with a
# warning annotation. It does not fail: a failing five-minute schedule would
# send a notification email every five minutes.
#
# The gate. verify.py exits 1 when the freshly built workbook fails any check.
# That fails this job on purpose: nothing is committed and the published site
# keeps the last version that passed.
name: Refresh data

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

# The commit is authored with GITHUB_TOKEN, and GitHub never lets one
# workflow's token trigger another, so pages.yml would not fire. This job
# deploys the site itself, in the same run, when it has committed.
permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: refresh
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - id: key
        name: Is the FEC key configured?
        env:
          FEC_API_KEY: ${{ secrets.FEC_API_KEY }}
        run: |
          if [ -n "$FEC_API_KEY" ]; then
            echo "have=true" >> "$GITHUB_OUTPUT"
          else
            echo "have=false" >> "$GITHUB_OUTPUT"
            echo "::warning::FEC_API_KEY secret is not set, so nothing was refreshed. Add it with: gh secret set FEC_API_KEY --repo ${{ github.repository }}"
          fi

      - uses: actions/setup-python@v5
        if: steps.key.outputs.have == 'true'
        with:
          python-version: "3.11"
      - if: steps.key.outputs.have == 'true'
        run: pip install --quiet openpyxl formulas

      - name: Collect from the FEC
        if: steps.key.outputs.have == 'true'
        env:
          FEC_API_KEY: ${{ secrets.FEC_API_KEY }}
        run: python collect_fec.py

      - name: Build the workbook
        if: steps.key.outputs.have == 'true'
        run: python build_workbook.py

      - name: Gate
        if: steps.key.outputs.have == 'true'
        run: python verify.py

      - name: Export the site payload
        if: steps.key.outputs.have == 'true'
        run: python export_site.py

      - id: commit
        name: Commit, if anything other than a timestamp changed
        if: steps.key.outputs.have == 'true'
        run: |
          if python changed.py; then
            git config user.name "pa07-finance-refresh"
            git config user.email "pa07-finance-refresh@users.noreply.github.com"
            git add sources/fec.json sources/fec_history.json sources/fec_detail.json site/data site/PA07_Campaign_Finance.xlsx
            git commit -m "Refresh FEC data $(date -u '+%Y-%m-%d %H:%M UTC')"
            # A pull request may have merged since checkout. This job only
            # touches the files above, which CI forbids branches from editing,
            # so a rebase onto the new tip cannot conflict.
            git pull --rebase --quiet origin main
            git push
            echo "committed=true" >> "$GITHUB_OUTPUT"
          else
            echo "committed=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Publish the site
        if: steps.commit.outputs.committed == 'true'
        uses: actions/configure-pages@v5
      - if: steps.commit.outputs.committed == 'true'
        uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deployment
        if: steps.commit.outputs.committed == 'true'
        uses: actions/deploy-pages@v4
